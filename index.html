<style>
:root{--ink:#f7efdd;--mute:#b9cbbf;--red:#d8343c;--gold:#ffd447;--panel:rgba(8,28,19,.72);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#07140f}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#12382a 0%,#07140f 70%);position:relative}
#tree{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:2;max-width:520px;margin:0 auto;padding:18px 14px 40px}
h1{margin:6px 0 2px;font-size:27px;text-align:center;letter-spacing:.3px;text-shadow:0 0 14px rgba(255,212,71,.55)}
.sub{text-align:center;color:var(--ink);font-size:14px;margin:0 0 14px;text-shadow:0 1px 4px #000}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.stat{background:var(--panel);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:1px solid rgba(255,212,71,.35);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--gold)}
.stat span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
.grid{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:16px 10px;padding:12px 0 4px;align-items:center}
.door{width:100%;aspect-ratio:var(--ar,1);border:0;border-radius:var(--br,8px);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:1;box-shadow:0 3px 6px rgba(0,0,0,.5);transition:transform .15s;color:#fff;transform:translateY(var(--dy,0)) rotate(var(--rot,0deg)) scale(var(--sc,1))}
.door:active{transform:translateY(var(--dy,0)) rotate(var(--rot,0deg)) scale(calc(var(--sc,1)*.92))}
.avail,.locked{background:linear-gradient(var(--rib),var(--rib)) center/var(--rv,16%) 100% no-repeat,linear-gradient(var(--rib),var(--rib)) center/100% var(--rh,16%) no-repeat,var(--pat,linear-gradient(transparent,transparent)),var(--box)}
.avail::before,.locked::before{content:"";position:absolute;top:-8px;left:50%;width:32px;height:15px;margin-left:-16px;background:radial-gradient(circle at 25% 55%,var(--rib) 5.5px,transparent 6.5px),radial-gradient(circle at 75% 55%,var(--rib) 5.5px,transparent 6.5px)}
.nb::before{display:none}
.lab{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;background:var(--box);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;box-shadow:0 0 0 2px var(--rib)}
.avail{animation:wob 2.8s ease-in-out infinite}
@keyframes wob{0%,80%,100%{transform:translateY(var(--dy,0)) rotate(var(--rot,0deg)) scale(var(--sc,1))}85%{transform:translateY(var(--dy,0)) rotate(calc(var(--rot,0deg) - 5deg)) scale(var(--sc,1))}90%{transform:translateY(var(--dy,0)) rotate(calc(var(--rot,0deg) + 5deg)) scale(var(--sc,1))}95%{transform:translateY(var(--dy,0)) rotate(calc(var(--rot,0deg) - 2deg)) scale(var(--sc,1))}}
.locked{--box:#25362e;--rib:#364a40;--pat:linear-gradient(transparent,transparent);cursor:not-allowed;opacity:.7;box-shadow:none}
.locked .lab{color:#8fa497}
.open{background:linear-gradient(#fff8e6,#f1e3bd);color:#2b2118;border:2px solid var(--gold)}
.open .n{font-size:11px;color:#7a6a4d;font-weight:700}
.open .km{font-size:22px;font-weight:800;color:#b3262e;line-height:1}
.open .u{font-size:10px;color:#7a6a4d}
.done{background:#1f7a4f;border:2px solid #4fd08c;color:#fff}
.done .n,.done .u{color:#d9ffe9;font-size:11px}
.done .km{font-size:22px;font-weight:800;line-height:1}
#snow{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
#snow i{position:absolute;top:-12px;border-radius:50%;background:#fff;opacity:.85;animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--sx),108vh)}}
.hint{text-align:center;color:var(--ink);font-size:12.5px;margin:18px 6px 0;line-height:1.5;text-shadow:0 1px 4px #000}
.tools{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{background:var(--panel);color:var(--ink);border:1px solid rgba(255,212,71,.4);border-radius:20px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.on{background:var(--gold);color:#1d1a10;border-color:var(--gold)}
.strava{background:#fc4c02;color:#fff;border:0}
/* tree */
.L{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.15}45%,55%{opacity:1}}
.sw{animation:sway 3.2s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.star{animation:tw 2.4s ease-in-out infinite;filter:drop-shadow(0 0 7px #ffd447)}
@keyframes tw{0%,100%{opacity:.75}50%{opacity:1}}
/* unwrap scene */
.ov{position:fixed;inset:0;background:rgba(4,12,8,.86);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:20;padding:20px;overflow:hidden}
.ov.show{display:flex}
.scene{position:relative;width:100%;max-width:340px;text-align:center}
.dayl{font-size:15px;color:var(--mute);letter-spacing:1px;text-transform:uppercase}
.gift{position:relative;width:170px;height:136px;margin:140px auto 14px;--box:#c0262d;--rib:#f1c84b}
.gift::before{content:"";position:absolute;left:-90px;right:-90px;top:-120px;bottom:20px;background:radial-gradient(circle at 50% 55%,rgba(255,212,71,.65),transparent 62%);opacity:0;transition:opacity .5s;pointer-events:none}
.gbox,.glid{position:absolute;left:0;right:0;background:linear-gradient(var(--rib),var(--rib)) center/26px 100% no-repeat,var(--box)}
.gbox{left:10px;right:10px;bottom:0;height:100px;border-radius:6px;z-index:2;box-shadow:0 8px 18px rgba(0,0,0,.5)}
.glid{bottom:100px;height:36px;border-radius:6px;z-index:3;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.4)}
.bow{position:absolute;left:50%;bottom:100%;width:64px;height:30px;margin-left:-32px;background:radial-gradient(circle at 50% 75%,var(--rib) 8px,transparent 9px)}
.bow::before,.bow::after{content:"";position:absolute;top:0;width:30px;height:22px;border:6px solid var(--rib);border-radius:50%}
.bow::before{left:0;transform:rotate(-22deg)}.bow::after{right:0;transform:rotate(22deg)}
.num{position:absolute;left:0;right:0;bottom:24px;z-index:1;font-size:78px;font-weight:800;line-height:1;color:var(--gold);text-shadow:0 0 18px rgba(255,212,71,.9),0 2px 0 #7a5a0a;opacity:0;transform:scale(.3);transition:transform 1s cubic-bezier(.2,1.5,.4,1),opacity .4s}
.num small{font-size:24px;color:var(--ink);font-weight:700;text-shadow:none;margin-left:4px}
.s1{animation:shake .9s ease-in-out}
@keyframes shake{0%,100%{transform:none}15%{transform:translateX(-7px) rotate(-5deg)}30%{transform:translateX(7px) rotate(5deg)}45%{transform:translateX(-6px) rotate(-4deg)}60%{transform:translateX(6px) rotate(4deg)}75%{transform:translateX(-3px) rotate(-2deg)}}
.s2 .bow{animation:bowfly .5s ease-in forwards}
@keyframes bowfly{to{transform:translateY(-80px) rotate(30deg) scale(.2);opacity:0}}
.s3::before{opacity:1}
.s3 .glid{animation:lidfly .75s ease-in forwards}
@keyframes lidfly{to{transform:translate(80px,-170px) rotate(32deg);opacity:0}}
.s4 .num{opacity:1;transform:translateY(-150px) scale(1)}
.scene p{margin:8px 0 16px;color:var(--ink);font-size:15px;min-height:22px}
.acts{min-height:44px}
.scene .btn.go{background:var(--red);color:#fff;border:0;padding:11px 26px;font-size:15px}
#conf{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none}
#conf i{position:absolute;left:50%;top:55%;width:8px;height:13px;background:var(--c);opacity:0}
#conf.fire i{animation:burst 1.6s cubic-bezier(.15,.7,.4,1) forwards}
@keyframes burst{0%{opacity:1;transform:translate(0,0) rotate(0)}45%{opacity:1;transform:translate(var(--dx),var(--dy)) rotate(var(--r))}100%{opacity:0;transform:translate(calc(var(--dx)*1.2),calc(var(--dy) + 230px)) rotate(calc(var(--r)*2))}}
@media (prefers-reduced-motion:reduce){#snow{display:none}.L,.sw,.star,.avail{animation:none!important}.L{opacity:.8}}
</style>
</head>
<body>
<div id="snow"></div>
<svg id="tree" viewBox="0 0 400 800" preserveAspectRatio="xMidYMax meet" aria-hidden="true"></svg>
<div class="wrap">
  <h1>🎄 Run Advent Calendar</h1>
  <p class="sub" id="sub"></p>
  <div class="stats">
    <div class="stat"><b id="sOpen">0/25</b><span>Presents</span></div>
    <div class="stat"><b id="sRev">0</b><span>Km revealed</span></div>
    <div class="stat"><b id="sDone">0</b><span>Km run</span></div>
  </div>
  <div class="grid" id="grid"></div>
  <p class="hint">Unwrap each day’s present to reveal your run. Every distance from 1 to 25 km appears exactly once. Tap an unwrapped present after your run to tick it off.</p>
  <div class="tools">
    <button class="btn strava" id="rec">Record on Strava</button>
    <a class="btn" href="https://www.strava.com/upload/manual" target="_blank" rel="noopener">Add manual activity</a>
  </div>
  <div class="tools">
    <button class="btn" id="preview">Preview mode: off</button>
    <button class="btn" id="reset">Reset</button>
  </div>
</div>
<div class="ov" id="ov"><div class="scene">
  <div class="dayl" id="mDay"></div>
  <div class="gift" id="gift">
    <div class="num"><span id="mKm">?</span><small>km</small></div>
    <div class="gbox"></div>
    <div class="glid"><div class="bow"></div></div>
  </div>
  <p id="mMsg"></p>
  <div class="acts"><button class="btn go" id="mClose" style="display:none">Let’s run!</button> <button class="btn strava" id="mRec" style="display:none">Strava</button></div>
  <div id="conf"></div>
</div></div>
<script>
(function(){
var NOW=new Date(),MON=NOW.getMonth(),YEAR=NOW.getFullYear();
var PAL=[['#b3262e','#f1c84b'],['#0f6b4a','#e7414a'],['#1f4e9a','#e9eef5'],['#6f3a9c','#f4d36b'],['#e8dcc0','#b3262e'],['#d9772b','#1f4e3a'],['#0c8a8a','#f3e9d2'],['#2a2a3a','#e7b94a'],['#c94f7c','#f6e7b0'],['#f0f3f7','#2b5fa8']];
var mem={};
function sGet(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}}
function sSet(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}
function sDel(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}}
var preview=sGet('runadv:mode')==='preview';
function key(){return 'runadv:'+(preview?'preview':'real')+':'+YEAR}
var st={opened:{},done:{}};
function load(){var r=sGet(key());st={opened:{},done:{}};if(r){try{var p=JSON.parse(r);if(p&&p.opened)st=p;if(!st.done)st.done={}}catch(e){}}}
function save(){sSet(key(),JSON.stringify(st))}
function unlocked(){if(preview)return 25;if(MON<11)return 0;if(MON===11)return Math.min(25,NOW.getDate());return 25}
function draw(){
  var u={},pool=[],i;for(var d in st.opened)u[st.opened[d]]=1;
  for(i=1;i<=25;i++)if(!u[i])pool.push(i);
  if(!pool.length)return null;
  var r;try{var a=new Uint32Array(1);crypto.getRandomValues(a);r=a[0]/4294967296}catch(e){r=Math.random()}
  return pool[Math.floor(r*pool.length)];
}
function hv(d,m){return ((d*131+m*977)%1009)/1009}
function pidx(d){return (d*3+Math.floor((d-1)/5))%PAL.length}
var WS=[
 {rv:'16%',rh:'16%',pat:'linear-gradient(transparent,transparent)',nb:0},
 {rv:'18%',rh:'0%',pat:'radial-gradient(circle,rgba(255,255,255,.38) 2.2px,transparent 2.8px) 0 0/12px 12px',nb:0},
 {rv:'0%',rh:'20%',pat:'repeating-linear-gradient(45deg,rgba(255,255,255,.24) 0 5px,transparent 5px 12px)',nb:0},
 {rv:'14%',rh:'14%',pat:'linear-gradient(90deg,rgba(0,0,0,.16) 50%,transparent 50%) 0 0/16px 16px,linear-gradient(rgba(0,0,0,.16) 50%,transparent 50%) 0 0/16px 16px',nb:0},
 {rv:'0%',rh:'0%',pat:'radial-gradient(circle,rgba(255,255,255,.55) 3px,transparent 3.6px) 0 0/18px 18px',nb:1}
];
function render(){
  var g=document.getElementById('grid');g.innerHTML='';
  var up=unlocked(),openN=0,rev=0,dn=0;
  for(var d=1;d<=25;d++){
    var b=document.createElement('button');b.className='door';b.type='button';
    var pal=PAL[pidx(d)],ws=WS[(d*7+Math.floor(d/5))%WS.length];
    b.style.setProperty('--box',pal[0]);b.style.setProperty('--rib',pal[1]);
    b.style.setProperty('--rv',ws.rv);b.style.setProperty('--rh',ws.rh);b.style.setProperty('--pat',ws.pat);
    b.style.setProperty('--ar',[1,.9,1.1,.96,1.06][Math.floor(hv(d,2)*5)]);
    b.style.setProperty('--rot',((hv(d,3)-.5)*10).toFixed(1)+'deg');
    b.style.setProperty('--sc',(0.9+hv(d,4)*.12).toFixed(2));
    b.style.setProperty('--dy',Math.round((hv(d,5)-.5)*10)+'px');
    b.style.setProperty('--br',['6px','10px','4px','12px','8px'][Math.floor(hv(d,6)*5)]);
    b.style.animationDelay=(-hv(d,7)*2.8).toFixed(2)+'s';
    var km=st.opened[d];
    if(km){
      openN++;rev+=km;var isDone=!!st.done[d];if(isDone)dn+=km;
      b.className+=isDone?' done':' open';
      b.innerHTML='<span class="n">Dec '+d+(isDone?' ✓':'')+'</span><span class="km">'+km+'</span><span class="u">km</span>';
      b.setAttribute('aria-label','Dec '+d+': '+km+' km'+(isDone?', done':''));
      b.onclick=(function(dd){return function(){if(st.done[dd])delete st.done[dd];else st.done[dd]=1;save();render()}})(d);
    }else if(d<=up){
      b.className+=' avail'+(ws.nb?' nb':'');b.innerHTML='<span class="lab">'+d+'</span>';
      b.setAttribute('aria-label','Unwrap present for Dec '+d);
      b.onclick=(function(dd){return function(){reveal(dd)}})(d);
    }else{
      b.className+=' locked'+(ws.nb?' nb':'');b.disabled=true;b.innerHTML='<span class="lab">'+d+'</span>';
    }
    g.appendChild(b);

  document.getElementById('sRev').textContent=rev;

  else sub.textContent=openN===25?'All 25 presents unwrapped. Merry Christmas!':'Come back tomorrow for the next present';

function bez(a,c,b,t){var u=1-t;return [u*u*a[0]+2*u*t*c[0]+t*t*b[0],u*u*a[1]+2*u*t*c[1]+t*t*b[1]]}
function weave(){
  var g=document.getElementById('grid'),ds=g.querySelectorAll('.door');
  if(ds.length<25)return;
  wl.length=0;
  var W=g.clientWidth,H=g.clientHeight;
  function mk(z){var sv=el('svg',{width:W,height:H,viewBox:'0 0 '+W+' '+H},null);sv.style.cssText='position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:'+z;return sv}
  var back=mk(0),top=mk(2);g.insertBefore(back,g.firstChild);g.appendChild(top);
  var k=0;
  [1,3].forEach(function(r){
    for(var c=0;c<5;c++){
      var d=ds[r*5+c],x0=d.offsetLeft,x1=x0+d.offsetWidth,h=d.offsetHeight,yc=d.offsetTop+h/2;
      var front=(c%2===0)&&d.classList.contains('avail')||(c%2===0)&&d.classList.contains('locked');
      var a=[c===0?x0-16:x0-5,yc],b=[c===4?x1+16:x1+5,yc],m=[(a[0]+b[0])/2,front?yc+h*.62:yc-h*1.5];
      var sv=front?top:back;
      el('path',{d:'M'+a[0]+','+a[1]+' Q'+m[0]+','+m[1]+' '+b[0]+','+b[1],fill:'none',stroke:'#06150e','stroke-width':2.2,'stroke-linecap':'round'},sv);
      [.2,.5,.8].forEach(function(t){
        var q=bez(a,m,b,t),ci=k%4,gg=el('g',{class:'L'},sv);
        el('circle',{cx:q[0],cy:q[1],r:8,fill:LC[ci],opacity:.3},gg);
        el('circle',{cx:q[0],cy:q[1],r:3.8,fill:LC[ci]},gg);
        el('circle',{cx:q[0]-1,cy:q[1]-1,r:1.2,fill:'#fff',opacity:.8},gg);
        wl.push({g:gg,i:300+k,c:ci});k++;
      });
    }
  });
  setMode(mode);
}
var busy=false;
function confetti(){
  var c=document.getElementById('conf');c.className='';c.innerHTML='';
  var cols=['#ff4d4d','#ffd447','#4da6ff','#7dff7d','#ffffff','#ff9ad5'];
  for(var i=0;i<46;i++){
    var s=document.createElement('i'),a=Math.random()*Math.PI*2,v=90+Math.random()*130;
    s.style.setProperty('--c',cols[i%cols.length]);
    s.style.setProperty('--dx',Math.round(Math.cos(a)*v)+'px');
    s.style.setProperty('--dy',Math.round(Math.sin(a)*v-110)+'px');
    s.style.setProperty('--r',Math.round(Math.random()*720-360)+'deg');
    c.appendChild(s);
  }
  void c.offsetWidth;c.className='fire';
}
function reveal(d){
  if(busy||st.opened[d])return;
  var km=draw();if(km===null)return;
  busy=true;
  var pal=PAL[pidx(d)],g=document.getElementById('gift');
  g.style.setProperty('--box',pal[0]);g.style.setProperty('--rib',pal[1]);g.className='gift';
  document.getElementById('mKm').textContent=km;
  document.getElementById('mDay').textContent='December '+d;
  document.getElementById('mMsg').textContent='';
  document.getElementById('mClose').style.display='none';document.getElementById('mRec').style.display='none';
  document.getElementById('conf').className='';document.getElementById('conf').innerHTML='';
  document.getElementById('ov').classList.add('show');
  st.opened[d]=km;save();
  setTimeout(function(){g.className='gift s1'},350);
  setTimeout(function(){g.className='gift s1 s2'},1300);
  setTimeout(function(){g.className='gift s1 s2 s3';confetti()},1850);
  setTimeout(function(){g.className='gift s1 s2 s3 s4'},2350);
  setTimeout(function(){
    document.getElementById('mMsg').textContent=km<=5?'A gentle one. Enjoy it!':km<=12?'A solid run today.':km<=19?'Time to lace up properly.':'Big day. Fuel up!';
    document.getElementById('mClose').style.display='inline-block';document.getElementById('mRec').style.display='inline-block';
    busy=false;render();
  },3500);
}
document.getElementById('mClose').onclick=function(){document.getElementById('ov').classList.remove('show')};
document.getElementById('preview').onclick=function(){preview=!preview;sSet('runadv:mode',preview?'preview':'real');load();render()};
document.getElementById('reset').onclick=function(){
  if(confirm('Reset your '+(preview?'preview calendar':'calendar')+'? All unwrapped presents will be cleared.')){sDel(key());load();render()}
};
function openStrava(){
  var t=Date.now();
  try{window.open('strava://record','_blank')}catch(e){}
  setTimeout(function(){if(!document.hidden&&Date.now()-t<2500){window.open('https://www.strava.com','_blank','noopener')}},1200);
}
document.getElementById('rec').onclick=openStrava;
document.getElementById('mRec').onclick=openStrava;
/* Christmas tree background */
var NS='http://www.w3.org/2000/svg',lights=[],wl=[],mode=0;
var LC=['#ff4d4d','#ffd447','#4da6ff','#7dff7d'];
function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}

      });

  function sway(g,x,y,i){g.setAttribute('class','sw');g.style.transformOrigin=x+'px '+y+'px';g.style.animationDelay=(-i*0.37)+'s'}
  /* baubles */
  [[150,300,9,'#e63946'],[240,285,8,'#ffd447'],[200,205,8,'#4da6ff'],[185,420,10,'#4da6ff'],[260,455,9,'#e63946'],[120,470,9,'#ffd447'],[200,600,11,'#e63946'],[100,620,10,'#4da6ff'],[300,640,10,'#ffd447'],[160,730,11,'#4da6ff'],[250,745,10,'#e63946'],[70,760,9,'#ffd447'],[330,770,9,'#e63946']].forEach(function(b,i){

  });
  /* teardrop ornaments */
  [[145,365,'#e63946'],[255,540,'#ffd447'],[115,700,'#e63946'],[285,705,'#4da6ff'],[215,265,'#ffd447']].forEach(function(o,i){

    el('path',{d:'M'+x+','+(y-17)+' C'+(x+14)+','+(y-2)+' '+(x+10)+','+(y+14)+' '+x+','+(y+14)+' C'+(x-10)+','+(y+14)+' '+(x-14)+','+(y-2)+' '+x+','+(y-17)+'Z',fill:o[2],stroke:'rgba(0,0,0,.25)','stroke-width':1},g);

  [[170,255],[235,380],[110,545],[300,560],[200,500],[180,650],[60,740]].forEach(function(o,i){
    var x=o[0],y=o[1],g=el('g',{},svg);sway(g,x,y-12,i+9);

    });
    el('circle',{cx:x,cy:y,r:2.6,fill:'#f4fbff'},g);
  });
  /* small gold stars */
  [[150,520],[250,660],[180,330],[300,745],[95,690]].forEach(function(o,i){
    var pts=[];for(var k=0;k<10;k++){var rr=k%2?4:10,a=-Math.PI/2+k*Math.PI/5;pts.push((o[0]+rr*Math.cos(a)).toFixed(1)+','+(o[1]+rr*Math.sin(a)).toFixed(1))}
    var g=el('g',{},svg);sway(g,o[0],o[1]-10,i+14);

  [[225,445],[135,570],[270,605],[190,770],[320,700],[80,705]].forEach(function(o,i){
    var x=o[0],y=o[1],g=el('g',{},svg);sway(g,x+13,y-26,i+3);
    var d='M'+x+','+(y+28)+' L'+x+','+(y-8)+' Q'+x+','+(y-26)+' '+(x+13)+','+(y-26)+' Q'+(x+26)+','+(y-26)+' '+(x+26)+','+(y-12);
    el('path',{d:d,fill:'none',stroke:'#fff','stroke-width':7,'stroke-linecap':'round'},g);
    el('path',{d:d,fill:'none',stroke:'#d8343c','stroke-width':7,'stroke-dasharray':'5 6'},g);
  });
  /* star topper */
  var pts=[];for(var i=0;i<10;i++){var rr=i%2?11:26,a=-Math.PI/2+i*Math.PI/5;pts.push((200+rr*Math.cos(a)).toFixed(1)+','+(86+rr*Math.sin(a)).toFixed(1))}
  el('line',{x1:164,y1:86,x2:236,y2:86,stroke:'#ffe68a','stroke-width':2,'stroke-linecap':'round',class:'star'},svg);
  el('line',{x1:200,y1:50,x2:200,y2:122,stroke:'#ffe68a','stroke-width':2,'stroke-linecap':'round',class:'star'},svg);
  el('polygon',{points:pts.join(' '),fill:'#ffd447',class:'star'},svg);
}
function buildSnow(){
  var c=document.getElementById('snow');
  for(var i=0;i<38;i++){
    var f=document.createElement('i'),z=2+Math.random()*3.5;
    f.style.left=(Math.random()*100)+'%';f.style.width=f.style.height=z+'px';
    f.style.animationDuration=(9+Math.random()*10)+'s';f.style.animationDelay=(-Math.random()*18)+'s';
    f.style.setProperty('--sx',Math.round(Math.random()*80-40)+'px');
    c.appendChild(f);
  }
}
function setMode(m){
  lights.concat(wl).forEach(function(L){
    var d,du;
    if(m===0){d=(L.i%8)*0.2;du=1.6}else if(m===1){d=(L.i%2)*0.8;du=1.6}else if(m===2){d=0;du=2.4}else{d=L.c*0.5;du=2}
    L.g.style.animationDuration=du+'s';L.g.style.animationDelay=(-d)+'s';
  });
}
buildTree();buildSnow();setMode(0);
setInterval(function(){mode=(mode+1)%4;setMode(mode)},6000);
